name: Deploy Server to VPS

on:
  push:
    branches:
      - main # Change this to master if your default branch is master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,Dockerfile,pyproject.toml,uv.lock,requirements.txt,worker.py,main.py,database.py,models.py,auth.py,run_worker.py,cloudinary_client.py,ai,routes"
          target: "/root/legal-assistant/server"

      - name: SSH and Restart Containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/legal-assistant/server
            
            # Stop Dokploy/Apache/Nginx if running
            docker stop dokploy-traefik dokploy || true
            docker rm dokploy-traefik dokploy || true
            systemctl stop nginx || true
            systemctl stop apache2 || true

            # Pull/Build and restart containers
            docker compose down || true
            docker compose build --no-cache
            docker compose up -d
            
            # Verify status
            docker compose ps
