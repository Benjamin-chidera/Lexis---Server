name: Server CI & CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: uv run pytest

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    # Only run deployment on pushes to main branch, not on pull request builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,Dockerfile,pyproject.toml,uv.lock,requirements.txt,worker.py,main.py,database.py,models.py,auth.py,run_worker.py,cloudinary_client.py,ai,routes"
          target: "/root/legal-assistant/server"

      - name: SSH and Restart Containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/legal-assistant/server
            
            # Stop Dokploy/Apache/Nginx if running
            docker stop dokploy-traefik dokploy || true
            docker rm dokploy-traefik dokploy || true
            systemctl stop nginx || true
            systemctl stop apache2 || true

            # Pull/Build and restart containers
            docker compose down || true
            docker compose build --no-cache
            docker compose up -d
            
            # Verify status
            docker compose ps
