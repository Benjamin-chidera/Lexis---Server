name: Server CI & CD

on:
  push:
    branches:
      # - main
      - development
  pull_request:
    branches:
      - main
      # - development

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: uv run pytest

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    env:
      IMAGE_NAME: lexis

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate and set Docker namespace
        id: set-namespace
        run: |
          NAMESPACE="${{ vars.DOCKERHUB_USERNAME }}"
          if [ -z "$NAMESPACE" ]; then
            NAMESPACE="${{ secrets.DOCKERHUB_USERNAME }}"
          fi
          if [ -z "$NAMESPACE" ]; then
            echo "::error::Docker namespace is empty. Please set DOCKERHUB_USERNAME under either Actions Secrets or Repository Variables."
            exit 1
          fi
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.set-namespace.outputs.namespace }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.set-namespace.outputs.namespace }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.set-namespace.outputs.namespace }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Dokploy Deployment
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via Dokploy API
        run: |
          response=$(curl -s -w "\n%{http_code}" -X 'POST' \
            '${{ secrets.DOKPLOY_URL }}/api/application.deploy' \
            -H 'accept: application/json' \
            -H 'x-api-key: ${{ secrets.DOKPLOY_API_KEY }}' \
            -H 'Content-Type: application/json' \
            --connect-timeout 10 \
            --max-time 30 \
            -d '{
              "applicationId": "${{ secrets.DOKPLOY_APP_ID }}"
            }')
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status Code: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Deployment trigger failed with HTTP status $http_code"
            exit 1
          fi

