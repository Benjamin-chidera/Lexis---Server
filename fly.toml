# fly.toml app configuration file generated for lexis-server on 2026-05-18T10:01:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lexis-server'
primary_region = 'lhr'

[env]
  ENVIRONMENT = "production"

[build]

[processes]
  # "main:app" = the socketio.ASGIApp at the bottom of main.py
  # uvicorn is more reliable than "fastapi run" for custom ASGI apps
  web = "/app/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8080"
  worker = "/app/.venv/bin/python run_worker.py"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['web']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1