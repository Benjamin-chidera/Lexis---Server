services:
  redis:
    image: redis:alpine
    container_name: legal-assistant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # This is the UI for your background tasks
  dashboard:
    image: cjlapao/rq-dashboard:latest
    container_name: legal-assistant-dashboard
    ports:
      - "9181:9181"
    environment:
      # We use the container name 'redis' here because Docker connects them
      - RQ_DASHBOARD_REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

volumes:
  redis_data: