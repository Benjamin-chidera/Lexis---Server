# LOCAL DEVELOPMENT ONLY — Production uses Dokploy
services:
  redis:
    image: redis:alpine
    container_name: legal-assistant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: legal-assistant-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse-server:3000}
    depends_on:
      - redis

  worker:
    build: .
    container_name: legal-assistant-worker
    command: ["/app/.venv/bin/python", "run_worker.py"]
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=development
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse-server:3000}
    depends_on:
      - redis

  dashboard:
    image: cjlapao/rq-dashboard:latest
    container_name: legal-assistant-dashboard
    ports:
      - "9181:9181"
    environment:
      - RQ_DASHBOARD_REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  langfuse-server:
    image: ghcr.io/langfuse/langfuse:2
    container_name: legal-assistant-langfuse
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # - DATABASE_URL=${LANGFUSE_DB_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-mysecret} # Fallback to 'mysecret' if not set in .env
      - SALT=${SALT:-mysalt} # Fallback to 'mysalt' if not set in .env
      - NEXTAUTH_URL=${NEXTAUTH_URL} # Replace with your VPS IP or Domain in production
      - TELEMETRY_ENABLED=false

volumes:
  redis_data: